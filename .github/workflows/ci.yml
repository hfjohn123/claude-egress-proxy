name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491
        with:
          go-version: '1.26.5'
          check-latest: true
      - shell: pwsh
        run: |
          $unformatted = @(gofmt -l (git ls-files -co --exclude-standard -- '*.go'))
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -ne 0) { $unformatted | Write-Error; exit 1 }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -race ./internal/... ./integration/... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/policy -run=Fuzz -fuzz=FuzzAuthority -fuzztime=30s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/credential -run=Fuzz -fuzz=FuzzCredentialDecode -fuzztime=30s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/credential -run=Fuzz -fuzz=FuzzBasicVerifier -fuzztime=30s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/wire -run=Fuzz -fuzz=FuzzFramingValues -fuzztime=30s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # target windows/amd64
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build ./cmd/claude-egress-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # target windows/arm64
          $env:GOARCH = 'arm64'
          go build ./cmd/claude-egress-proxy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GOOS, Env:GOARCH -ErrorAction SilentlyContinue
          pwsh -NoProfile -File scripts/verify-generated.ps1
          pwsh -NoProfile -File scripts/verify-public-data.ps1
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-${{ matrix.os }}
          path: out
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491
        with:
          go-version: '1.26.5'
      - shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-secrets.ps1
      - name: build immutable OCI archive
        run: mkdir -p out && docker buildx build --load --tag claude-egress-proxy:ci -f deploy/docker/Dockerfile . && docker save --output out/ci-image.tar claude-egress-proxy:ci
      - shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-container.ps1 -Archive out/ci-image.tar -ReportDirectory out/container-scan -SourceCommit '${{ github.sha }}' -Platform linux/amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-scan
          path: out/container-scan
          retention-days: 7
